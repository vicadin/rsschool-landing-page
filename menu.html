<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee House</title>
  <link href="normalize.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico" />
</head>

<body>
  <header class="header">
    <a href="index.html" class="logo">
      <img src="assets/images/logo.svg" alt="logo coffee house" />
    </a>

    <nav>
      <ul class="nav">
        <li class="nav__item"><a href="index.html#favorite">Favorite coffee</a></li>
        <li class="nav__item"><a href="index.html#about">About</a></li>
        <li class="nav__item"><a href="index.html#app">Mobile app</a></li>
        <li class="nav__item"><a href="#contact">Contact us</a></li>
      </ul>
    </nav>
    <div class="menu menu_active">
      <a>
        Menu
        <img src="assets/images/coffee-cup.svg" alt="coffee cup" />
      </a>

    </div>
    <div class="menu-burger" id="menuBurger">
      <nav>
        <ul class="menu-nav">
          <li class="nav__item"><a href="index.html#favorite">Favorite coffee</a></li>
          <li class="nav__item"><a href="index.html#about">About</a></li>
          <li class="nav__item"><a href="index.html#app">Mobile app</a></li>
          <li class="nav__item"><a href="#contact">Contact us</a></li>
        </ul>
      </nav>
      <div class="menu-mob">
        <a href="menu.html">
          Menu
          <img src="assets/images/coffee-cup.svg" alt="coffee cup" />
        </a>

      </div>
    </div>
    <div class="button-burger" id="buttonBurger">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="2" viewBox="0 0 18 2" fill="none">
        <path d="M1 1H17" stroke="#403F3D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="2" viewBox="0 0 18 2" fill="none">
        <path d="M1 1H17" stroke="#403F3D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
  </header>
  <section class="filter">
    <h1 class="heading-2">
      Behind each of our cups hides an <span>amazing surprise</span>
    </h1>
    <div class="filter-menu">
      <button class="filter-menu__item filter-menu__item_active" data-category="coffee">
        <img src="assets/images/coffee.svg" class="filter-menu__img" width="16" alt="coffee cup" />
        <span class="text-button">Coffee</span>
      </button>
      <button class="filter-menu__item" data-category="tea">
        <img src="assets/images/tee.svg" class="filter-menu__img" width="16" alt="tea cup" />
        <span class="text-button">Tea</span>
      </button>
      <button class="filter-menu__item" data-category="dessert">
        <img src="assets/images/cake.svg" class="filter-menu__img" width="16" alt="piece of cake" />
        <span class="text-button">Dessert</span>
      </button>
    </div>
    <div class="card-list">
    </div>
    <button class="btn-icon-dark" id="loadMore">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path
          d="M21.8883 13.5C21.1645 18.3113 17.013 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C16.1006 2 19.6248 4.46819 21.1679 8"
          stroke="#403F3D" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M17 8H21.4C21.7314 8 22 7.73137 22 7.4V3" stroke="#403F3D" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </button>
  </section>
  <footer class="footer" id="contact">
    <div>
      <h2 class="heading-2">
        Sip, Savor, Smile. <span>It’s coffee time!</span>
      </h2>
      <div class="social-buttons">
        <a class="btn-icon-light" href="#">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path
              d="M23 3.01006C23 3.01006 20.9821 4.20217 19.86 4.54006C19.2577 3.84757 18.4573 3.35675 17.567 3.13398C16.6767 2.91122 15.7395 2.96725 14.8821 3.29451C14.0247 3.62177 13.2884 4.20446 12.773 4.96377C12.2575 5.72309 11.9877 6.62239 12 7.54006V8.54006C10.2426 8.58562 8.50127 8.19587 6.93101 7.4055C5.36074 6.61513 4.01032 5.44869 3 4.01006C3 4.01006 -1 13.0101 8 17.0101C5.94053 18.408 3.48716 19.109 1 19.0101C10 24.0101 21 19.0101 21 7.51006C20.9991 7.23151 20.9723 6.95365 20.92 6.68006C21.9406 5.67355 23 3.01006 23 3.01006Z"
              stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>
        <a class="btn-icon-light" href="#">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path
              d="M12 16C14.2091 16 16 14.2091 16 12C16 9.79086 14.2091 8 12 8C9.79086 8 8 9.79086 8 12C8 14.2091 9.79086 16 12 16Z"
              stroke-linecap="round" stroke-linejoin="round" />
            <path
              d="M3 16V8C3 5.23858 5.23858 3 8 3H16C18.7614 3 21 5.23858 21 8V16C21 18.7614 18.7614 21 16 21H8C5.23858 21 3 18.7614 3 16Z" />
            <path d="M17.5 6.51L17.51 6.49889" stroke="#E1D4C9" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>
        <a class="btn-icon-light" href="#">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path
              d="M17 2H14C12.6739 2 11.4021 2.52678 10.4645 3.46447C9.52678 4.40215 9 5.67392 9 7V10H6V14H9V22H13V14H16L17 10H13V7C13 6.73478 13.1054 6.48043 13.2929 6.29289C13.4804 6.10536 13.7348 6 14 6H17V2Z"
              stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>
      </div>
    </div>
    <div class="contacts">
      <p class="heading-3">Contact us</p>
      <div class="contacts__item text-medium">
        <a href="https://maps.app.goo.gl/gaq47UVp4UidUHFs7" target="_blank">
          <img src="assets/images/pin-alt.svg" alt="icon map" />
          8558 Green Rd., LA</a>
      </div>
      <div class="contacts__item text-medium">
        <a href="tel:+16035550123">
          <img src="assets/images/phone.svg" alt="icon phone" />
          +1 (603) 555-0123</a>
      </div>
      <div class="contacts__item text-medium">
        <a href="#">
          <img src="assets/images/clock.svg" alt="icon clock" />
          Mon-Sat: 9:00 AM – 23:00 PM</a>
      </div>
    </div>
  </footer>

  <div class="overlay" id="overlay"></div>
  <script src="menu.js"></script>
</body>

</html>
